<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Spartan protocol search engine.">
  <title>Spartan Atlas</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <a class="brand" href="./" aria-label="Spartan Atlas home">
        <span class="mark">△</span>
        <span>Spartan Atlas</span>
      </a>
      <span class="protocol">spartan://</span>
    </header>

    <section class="hero">
      <p class="eyebrow">A map of the small web</p>
      <h1>Search the<br>Spartan web.</h1>
      <form id="search-form" role="search">
        <input id="query" name="q" type="search" autocomplete="off" maxlength="160" placeholder="Search pages…" aria-label="Search Spartan Atlas">
        <button type="submit">Search</button>
      </form>
      <p id="stats" class="stats">Loading index…</p>
    </section>

    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <footer>
    <span>Spartan Atlas</span>
    <span>No ads. No tracking. Not affiliated with Alumniminium/atlas.</span>
  </footer>

  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
